# SonarQube Configuration
sonar.projectKey=ds-lib-components
sonar.projectName=DS Lib Components
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.stories.tsx,**/*.test.tsx,**/storybook/**,**/*.d.ts

# Test files
sonar.tests=src
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts

# TypeScript/JavaScript configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Timeout configuration (60 minutes = 3600 seconds)
sonar.ws.timeout=3600
